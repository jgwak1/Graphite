# Example Logstash pipeline for ingesting ETW-derived events into Elasticsearch.
#
# This example accepts JSON events over HTTP, filters out events associated with
# common Windows system accounts, and writes the remaining events to Elasticsearch.
#
# Required environment variables:
#   ELASTICSEARCH_HOST  e.g. http://localhost:9200
#   LOGSTASH_INDEX      e.g. graphite-etw-events

input {
  http {
    port => 5444
  }
}

filter {
  ruby {
    init => '
      system_process_pids = []
      command = "tasklist /V"
      ps_output = `#{command}`

      ps_output.split(/[\r\n]+/).each do |line|
        next unless /System |AUTHORITY\\SYSTEM|AUTHORITY\\LOCAL|AUTHORITY\\NETWORK/.match?(line)

        fields = line.split(/\s+/)
        pid = fields[1]

        if pid == "Idle"
          system_process_pids << fields[3].to_i
        elsif pid == "Compression"
          system_process_pids << fields[2].to_i
        else
          system_process_pids << pid.to_i
        end
      end

      ENV["SYSTEM_PROCESS_PIDS"] = system_process_pids.to_json
    '
    code => '
      system_process_pids = JSON.parse(ENV["SYSTEM_PROCESS_PIDS"])

      if system_process_pids.include?(event.get("ProcessID").to_i)
        event.set("[@metadata][drop]", true)
      end
    '
  }

  if [@metadata][drop] {
    drop { }
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOST}"]
    index => "${LOGSTASH_INDEX}"
    data_stream => false
  }

  stdout {
    codec => json
  }
}
